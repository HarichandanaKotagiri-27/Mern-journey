<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <form id="bill-form">
    <div>

    <label for="bill-amount">Bill Amount :</label>
    <input type="number" id="bill-amount" name="bill-amount">

    <div id="tip-percentage">
        <label for="Tip-percentage">Tip Percentage : </label>
        <button type="button" class="tip-button">10</button>
        <button type="button" class="tip-button">15</button>
        <button type="button" class="tip-button">20</button>
        <button type="button" class="tip-button">25</button>
        <label for="custom-tip">Custom Tip : </label>
    <input type="text" placeholder="tip percentage" id="custom-tip">
    </div>
    
    

    <label for="people-number" >Number of people :</label>
    <input type="number" id="people-number">

    <button type="submit">Calculate</button>
    <button type="button" id="reset">Reset</button>
    </div> 
    </form>
    <p id="totalAmount"></p>
    <p id="totalPerPerson"></p>
    <p id="totalTip"></p>
    <p id="totalBill"></p>



    <script src="./app.js"></script>
</body>

</html>
